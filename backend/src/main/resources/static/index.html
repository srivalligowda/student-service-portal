


<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Service Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Student Login -->
    <div id="loginSection">

        <h1>Student Login</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <br><br>

        <button
            id="loginBtn"
            type="button"
            onclick="login()"
        >
            Login
        </button>

    </div>


    <!-- Student Registration -->
    <div id="registerSection">

        <h2>Student Registration</h2>

        <input
            type="text"
            id="regName"
            placeholder="Name"
        >

        <br><br>

        <input
            type="email"
            id="regEmail"
            placeholder="Email"
        >

        <br><br>

        <input
            type="password"
            id="regPassword"
            placeholder="Password"
        >

        <br><br>

        <button
            id="registerBtn"
            type="button"
            onclick="registerStudent()"
        >
            Register
        </button>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
