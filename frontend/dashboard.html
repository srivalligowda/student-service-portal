
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Service Portal - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page Heading -->
    <h1>Student Dashboard</h1>

    <p>Welcome to Student Service Portal</p>

    <!-- Dashboard Navigation Buttons -->
    <div id="dashboard">

        <button type="button" onclick="showProfile()">
            Profile
        </button>

        <button type="button" onclick="showAttendance()">
            Attendance
        </button>

        <button type="button" onclick="showMarks()">
            Marks / Results
        </button>

        <button type="button" onclick="showTimetable()">
            Timetable
        </button>

        <button type="button" onclick="showAssignments()">
            Assignments
        </button>

        <button type="button" onclick="showNotices()">
            Notices / Announcements
        </button>

        <button type="button" onclick="showLeaveRequests()">
            Leave Requests
        </button>

        <button type="button" onclick="showCertificates()">
            Certificates
        </button>

        <button type="button" onclick="showFees()">
            Fee Information
        </button>

        <button type="button" onclick="showComplaints()">
            Complaints / Helpdesk
        </button>

        <button type="button" onclick="showEvents()">
            College Events
        </button>

        <button type="button" onclick="showFaculty()">
            Faculty Information
        </button>

    </div>


    <!-- Dashboard Content Area -->
    <div id="dashboardContent">

        <h2>Welcome Student!</h2>

        <p>Select an option above to view your information.</p>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
